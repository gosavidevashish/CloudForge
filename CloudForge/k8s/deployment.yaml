apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: devops-demo
  labels:
    app: demo-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: demo-app
          image: demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # 1. Startup Probe: gives initial boot time before liveness takes over
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10

          # 2. Liveness Probe: restarts container if deadlock or crash occurs
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 3. Readiness Probe: pulls container from service traffic if failing
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Resource governance (prevents noisy-neighbor / OOM crashes)
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"