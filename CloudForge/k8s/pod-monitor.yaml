apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: demo-app-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: demo-app
  namespaceSelector:
    matchNames:
      - devops-demo
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s