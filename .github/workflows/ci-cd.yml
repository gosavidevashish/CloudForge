name: End-to-End DevSecOps & K8s Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f CloudForge/app/requirements.txt ]; then
            pip install -r CloudForge/app/requirements.txt
          else
            pip install -r CloudForge/requirements.txt
          fi

      - name: Run Unit Tests
        run: |
          PYTHONPATH=CloudForge pytest CloudForge/tests/

  sast-semgrep:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config auto --error CloudForge/ --exclude "tests"

  iac-secret-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Repo & Misconfig Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'CloudForge'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  build-and-publish:
    needs: [sast-semgrep, iac-secret-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Clean Container Image
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          docker build --provenance=false --sbom=false -t local-scan-target:${{ github.sha }} CloudForge

      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-scan-target:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: |
            GHSA-6v7p-g79w-8964
            CVE-2025-47273
            CVE-2026-97687
            CVE-2026-97689

      - name: Tag and Push Verified Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag local-scan-target:${{ github.sha }} ghcr.io/${REPO_LOWER}:sha-${{ github.sha }}
          docker tag local-scan-target:${{ github.sha }} ghcr.io/${REPO_LOWER}:latest
          docker push ghcr.io/${REPO_LOWER}:sha-${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}:latest

  deploy:
    needs: build-and-publish
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Manifests to Local Kubernetes
        shell: powershell
        run: |
          kubectl apply -f CloudForge/k8s/namespace.yaml
          kubectl apply -f CloudForge/k8s/configmap.yaml
          kubectl apply -f CloudForge/k8s/secret.example.yaml
          kubectl apply -f CloudForge/k8s/deployment.yaml
          kubectl apply -f CloudForge/k8s/service.yaml
          if (Test-Path CloudForge/k8s/ingress.yaml) { kubectl apply -f CloudForge/k8s/ingress.yaml }

          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLower()):sha-$env:GITHUB_SHA"
          kubectl set image deployment/demo-app app=$image -n devops-demo

      - name: Verify Kubernetes Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/demo-app -n devops-demo --timeout=120s